<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Para Daniela, con amor</title>
<meta name="description" content="Una carta de amor distinta cada día." />

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#7A2E38" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daniela ❤" />

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- Fondo ambiental -->
<div class="ambient" aria-hidden="true">
  <span class="petal p1">♥</span>
  <span class="petal p2">♥</span>
  <span class="petal p3">♥</span>
  <span class="petal p4">♥</span>
</div>

<!-- ===================== SPLASH SCREEN ===================== -->
<section id="splash" class="screen">
  <span class="heart-mark" aria-hidden="true">♥</span>
  <p class="tagline">Para el amor de mi vida</p>
  <button id="open-gift" class="pill-button">
    Te amo, <span id="wife-name-btn"></span>
  </button>
  <p class="hint">Toca para abrir</p>
</section>

<!-- ===================== PANTALLA DIARIA ===================== -->
<section id="daily" class="screen daily-screen" hidden>

  <!-- Fecha / momento del recuerdo -->
  <p class="memory-date" id="memory-date"></p>

  <!-- Carrusel de fotos -->
  <div class="carousel-wrap">
    <div class="carousel-frame">
      <div class="carousel" id="carousel"></div>
    </div>
    <div class="dots" id="carousel-dots"></div>
  </div>

  <p class="couple-names" id="couple-names"></p>

  <div class="squiggle" aria-hidden="true">〜</div>

  <!-- Sobre sellado -->
  <div id="envelope-wrap" class="envelope-wrap">
    <div class="envelope">
      <div class="envelope-flap"></div>
    </div>
    <button id="open-letter" class="seal-button" aria-label="Descubrir el mensaje del día">
      <span class="seal-inner"><span class="seal-label">Descúbrelo</span></span>
    </button>
  </div>

  <!-- Carta -->
  <div id="letter-wrap" class="letter-wrap" hidden>
    <div class="letter-paper">
      <p class="letter-text" id="letter-text"></p>
    </div>
    <p class="letter-question" id="letter-question"></p>
    <button id="confirm-btn" class="pill-button"></button>
  </div>

  <!-- Tiempo juntos -->
  <div id="final-wrap" class="final-wrap" hidden>
    <div class="squiggle" aria-hidden="true">〜</div>

    <p class="counter-caption counter-heading">Han sido los mejores</p>

    <div class="counter">
      <div class="counter-item">
        <span class="num" id="years-num">0</span>
        <span class="label">años</span>
      </div>
      <div class="counter-item">
        <span class="num" id="months-num">0</span>
        <span class="label">meses</span>
      </div>
      <div class="counter-item">
        <span class="num" id="days-num">0</span>
        <span class="label">días</span>
      </div>
    </div>
    <p class="counter-caption">de mi vida</p>

    <div class="final-photo-frame">
      <div class="photo-inner">
        <img id="final-photo" src="" alt="" />
      </div>
    </div>
    <p class="final-message" id="final-message"></p>

    <button id="restart-btn" class="pill-button outline restart-btn">Verlo de nuevo ♥</button>
  </div>

  <p class="footer-note">Vuelve mañana — habrá algo nuevo esperándote.</p>
</section>

<!-- Lightbox para ver las fotos en grande -->
<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox-close" aria-label="Cerrar foto">✕</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<!-- Reproductor de YouTube, oculto — solo se usa el audio -->
<div id="yt-player-slot"></div>
<button id="mute-toggle" class="mute-btn" hidden aria-label="Silenciar música">🔊</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="./app.js"></script>
</body>
</html>
