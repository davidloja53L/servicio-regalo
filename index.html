<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Para Daniela, con amor</title>
<meta name="description" content="Una carta de amor distinta cada día." />
<meta name="color-scheme" content="light only" />

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#7A2E38" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daniela ❤" />

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet" />

<!-- Música: se adelanta la conexión a YouTube desde ya, para que cuando
     ella toque el corazón la canción arranque lo más rápido posible
     (el script en sí se sigue cargando más abajo, esto solo "calienta"
     la conexión de antemano). -->
<link rel="preconnect" href="https://www.youtube.com" />
<link rel="preconnect" href="https://s.ytimg.com" crossorigin />
<link rel="dns-prefetch" href="https://www.youtube.com" />
<link rel="dns-prefetch" href="https://s.ytimg.com" />

<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- Corazones flotando de fondo -->
<div class="ambient" aria-hidden="true">
  <span class="orb orb1"></span>
  <span class="orb orb2"></span>
  <span class="orb orb3"></span>
  <span class="petal p1">♥</span>
  <span class="petal p2">♥</span>
  <span class="petal p3">♥</span>
  <span class="petal p4">♥</span>
  <span class="petal p5">♥</span>
</div>

<!-- ===================== PANTALLA DE INICIO ===================== -->
<section id="splash" class="screen splash">
  <div class="splash-inner">
    <span class="heart-mark reveal-1" aria-hidden="true">♥</span>
    <p class="tagline reveal-2">Para el amor de mi vida</p>

    <button id="open-gift" class="heart-button reveal-3" type="button" aria-label="Te amo, Dani — toca para abrir tu regalo">
      <span class="heart-halo" aria-hidden="true"></span>
      <svg class="heart-svg" viewBox="0 0 100 92" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="heartFillGrad" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0%"   stop-color="#D14E63" />
            <stop offset="38%"  stop-color="#A82942" />
            <stop offset="72%"  stop-color="#7A1730" />
            <stop offset="100%" stop-color="#520D20" />
          </linearGradient>
          <radialGradient id="heartSheen" cx="0.32" cy="0.24" r="0.55">
            <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55" />
            <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path
          class="heart-path"
          d="M50 89 C 19 66, 0 45, 0 27 C 0 10, 14 0, 29 0 C 41 0, 50 9, 50 17 C 50 9, 59 0, 71 0 C 86 0, 100 10, 100 27 C 100 45, 81 66, 50 89 Z"
          fill="url(#heartFillGrad)" />
        <path
          class="heart-sheen"
          d="M50 89 C 19 66, 0 45, 0 27 C 0 10, 14 0, 29 0 C 41 0, 50 9, 50 17 C 50 9, 59 0, 71 0 C 86 0, 100 10, 100 27 C 100 45, 81 66, 50 89 Z"
          fill="url(#heartSheen)" />
      </svg>
      <span class="heart-text">Te amo,<br /><span id="wife-name-btn"></span></span>
    </button>

    <p class="hint reveal-4">Toca para abrir</p>
  </div>
</section>

<!-- ===================== PANTALLA DEL DÍA ===================== -->
<section id="daily" class="screen daily-screen" hidden>

  <p class="special-banner" id="special-banner" hidden></p>
  <p class="memory-date" id="memory-date"></p>

  <!-- Carrusel de fotos -->
  <div class="carousel-wrap">
    <div class="carousel-frame">
      <div class="carousel" id="carousel" role="group" aria-label="Fotos del recuerdo de hoy"></div>
      <button class="carousel-nav prev" id="carousel-prev" type="button" aria-label="Foto anterior" hidden>‹</button>
      <button class="carousel-nav next" id="carousel-next" type="button" aria-label="Foto siguiente" hidden>›</button>
    </div>
    <div class="dots" id="carousel-dots"></div>
  </div>

  <p class="couple-names" id="couple-names"></p>

  <div class="ornament" aria-hidden="true">
    <span class="ornament-line"></span>
    <span class="ornament-heart">♥</span>
    <span class="ornament-line"></span>
  </div>

  <!-- Sobre sellado -->
  <div id="envelope-wrap" class="envelope-wrap">
    <div class="envelope" aria-hidden="true">
      <div class="envelope-body"></div>
      <div class="envelope-flap"></div>
    </div>
    <button id="open-letter" class="seal-button" type="button" aria-label="Abrir la carta de hoy">
      <span class="seal-inner"><span class="seal-label">Descúbrelo</span></span>
    </button>
  </div>

  <!-- Carta -->
  <div id="letter-wrap" class="letter-wrap" hidden>
    <div class="letter-paper">
      <span class="letter-flourish" aria-hidden="true">❦</span>
      <p class="letter-text" id="letter-text"></p>
    </div>
    <p class="letter-question" id="letter-question"></p>
    <button id="confirm-btn" class="pill-button" type="button"></button>
  </div>

  <!-- Tiempo juntos -->
  <div id="final-wrap" class="final-wrap" hidden>
    <div class="ornament" aria-hidden="true">
      <span class="ornament-line"></span>
      <span class="ornament-heart">♥</span>
      <span class="ornament-line"></span>
    </div>

    <p class="counter-heading">Han sido los mejores</p>

    <div class="counter">
      <div class="counter-item">
        <span class="num" id="years-num">0</span>
        <span class="label">años</span>
      </div>
      <span class="counter-sep" aria-hidden="true">·</span>
      <div class="counter-item">
        <span class="num" id="months-num">0</span>
        <span class="label">meses</span>
      </div>
      <span class="counter-sep" aria-hidden="true">·</span>
      <div class="counter-item">
        <span class="num" id="days-num">0</span>
        <span class="label">días</span>
      </div>
    </div>
    <p class="counter-caption">de mi vida</p>

    <div class="final-photo-frame">
      <div class="photo-inner">
        <img id="final-photo" alt="" />
      </div>
    </div>

    <p class="final-message" id="final-message"></p>

    <button id="open-video" class="pill-button video-btn" type="button">
      <span class="video-btn-icon" aria-hidden="true">▶</span> Tengo una sorpresa más
    </button>
    <button id="restart-btn" class="pill-button outline restart-btn" type="button">Verlo de nuevo ♥</button>
  </div>

  <p class="footer-note" id="footer-note" hidden>Vuelve mañana — habrá algo nuevo esperándote.</p>
</section>

<!-- ===================== VISOR DE FOTOS ===================== -->
<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Cerrar foto">✕</button>
  <button id="lightbox-prev" class="lightbox-nav prev" type="button" aria-label="Foto anterior">‹</button>
  <button id="lightbox-next" class="lightbox-nav next" type="button" aria-label="Foto siguiente">›</button>
  <div class="lightbox-stage">
    <img id="lightbox-img" alt="" />
  </div>
  <p class="lightbox-hint" id="lightbox-hint">Toca la foto para acercar</p>
</div>

<!-- ===================== REPRODUCTOR DE VIDEO ===================== -->
<div id="video-modal" class="video-modal" hidden role="dialog" aria-modal="true" aria-label="Un video para ti">
  <button id="video-close" class="lightbox-close" type="button" aria-label="Cerrar video">✕</button>
  <div class="video-stage">
    <video id="video-player" controls playsinline preload="none">
      <source id="video-source" src="video/sorpresa.mp4" type="video/mp4" />
      Tu navegador no puede reproducir este video.
    </video>
  </div>
</div>

<!-- Reproductor de YouTube oculto (solo audio) -->
<div id="yt-player-slot" aria-hidden="true"></div>
<button id="mute-toggle" class="mute-btn" hidden type="button" aria-label="Silenciar música">
  <span id="mute-icon">🔊</span>
</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="./app.js"></script>
</body>
</html>
